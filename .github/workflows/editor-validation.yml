name: Website editor validation
on:
  push:
    branches: [codex/editor-production-prep]
  pull_request:
    paths: ['server/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/editor-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Editor OAuth, scheduling, publication and isolation
        run: npm run test:editor
      - name: Agency API regression coverage
        run: node --test tests/client-work-log.test.mjs tests/contact-mail.test.mjs tests/gsc.test.mjs tests/intake-store.test.mjs tests/login-security.test.mjs tests/monthly-reports.test.mjs
